name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build tested release package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $version = if ($env:IS_TAG -eq 'true') { $env:RELEASE_TAG.TrimStart('v') } else { '0.1.0-dev.' + '${{ github.run_number }}' }
          ./scripts/release.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: SrunKeeper-windows-amd64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG (Get-ChildItem dist/*.zip,dist/*.sha256).FullName --title "SrunKeeper $env:RELEASE_TAG" --generate-notes
